<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>건일 선배 - Bubble Backup</title>
  <link rel="stylesheet" href="koobubble-v8.css" />
</head>
<body>

  <div class="nickname-modal" id="nicknameModal" aria-hidden="true">
    <div class="nickname-card">
      <div class="nickname-title">닉네임을 설정해주세요</div>
      <div class="nickname-desc">버블에서 불릴 이름을 입력해 주세요.</div>

      <input
        id="nicknameInput"
        class="nickname-input"
        type="text"
        maxlength="20"
        autocomplete="off"
        placeholder="닉네임"
      />

      <div class="nickname-preview">
        <span class="preview-label">표시 예시</span>
        <span id="nicknamePreview">닉네임</span>
      </div>

      <button id="nicknameSave" class="nickname-save" type="button">확인</button>
    </div>
  </div>

  <div class="phone" id="phone">
    <header class="header">
      <button class="back-btn" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 4L7 12l8 8"/>
        </svg>
      </button>

      <div class="header-center">
        <div class="room-title" id="roomTitle">건일 선배</div>
        <div class="room-status">
          <span class="heart" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 21s-7.2-4.7-9.7-8.8C.4 9.1 1.5 5.3 4.8 4.2c2.2-.7 4.5.2 5.7 2.1L12 8.5l1.5-2.2c1.2-1.9 3.5-2.8 5.7-2.1 3.3 1.1 4.4 4.9 2.5 8C19.2 16.3 12 21 12 21z"/>
            </svg>
          </span>
          <span id="roomStatus">980724</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="search-btn" id="searchBtn" aria-label="검색">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"/>
            <path d="M16 16l5 5"/>
          </svg>
        </button>
        <button class="more-btn" id="moreBtn" aria-label="더보기">⋮</button>
      </div>
    </header>

    <div class="search-box" id="searchBox">
      <div class="search-text-row">
        <input id="searchInput" type="search" placeholder="메시지 검색" />
        <button id="searchClose" type="button">취소</button>
      </div>

      <div class="date-search-row">
        <span class="date-search-label">날짜</span>
        <input id="dateSearchInput" type="date" />
        <button id="clearDateSearch" type="button">전체 보기</button>
      </div>
    </div>

    <main class="chat" id="chat"></main>

    <form class="composer" id="composer">
      <div class="input-pill">
        <textarea id="messageInput" rows="1" placeholder=""></textarea>
        <button class="smile-btn" type="button" aria-label="이모지">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="9" cy="10" r=".8" class="fill"/>
            <circle cx="15" cy="10" r=".8" class="fill"/>
            <path d="M8.5 14c1 1.6 2.2 2.3 3.5 2.3s2.5-.7 3.5-2.3"/>
          </svg>
        </button>
      </div>

      <button class="send-btn" id="sendBtn" type="submit" aria-label="보내기">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M3 4l22 10L3 24l3.8-8.1L17 14 6.8 12.1 3 4z"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="koobubble-data-v6.js"></script>
  <script src="koobubble-app-v8.js"></script>
</body>
</html>
