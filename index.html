<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bubble Backup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">
    <header class="header">
      <button class="header-btn back" aria-label="뒤로가기">‹</button>
      <div class="header-center">
        <div class="room-title" id="roomTitle">건일 선배</div>
        <div class="room-status"><span class="heart">♥</span><span id="roomStatus">우리 다시 만날 수 있겠지?</span></div>
      </div>
      <div class="header-actions">
        <button class="header-btn search" id="searchBtn" aria-label="검색"></button>
        <button class="header-btn more" aria-label="더보기">⋮</button>
      </div>
    </header>

    <div class="search-box" id="searchBox">
      <input id="searchInput" type="search" placeholder="메시지 검색" />
      <button id="searchClose">취소</button>
    </div>

    <main class="chat" id="chat"></main>

    <div class="composer">
      <div class="composer-input"></div>
      <button class="smile" aria-label="이모지">☺</button>
      <button class="send" aria-label="보내기"></button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
