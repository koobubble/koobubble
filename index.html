<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>건일 선배 - Bubble Backup</title>
  <link rel="stylesheet" href="koobubble-v13.css" />
</head>
<body>

  <div class="nickname-modal" id="nicknameModal" aria-hidden="true">
    <div class="nickname-card">
      <div class="nickname-title">닉네임을 설정해주세요</div>
      <div class="nickname-desc">버블에서 불릴 이름을 입력해 주세요.</div>

      <input
        id="nicknameInput"
        class="nickname-input"
        type="text"
        maxlength="20"
        autocomplete="off"
        placeholder="닉네임"
      />

      <div class="nickname-preview">
        <span class="preview-label">표시 예시</span>
        <span id="nicknamePreview">닉네임</span>
      </div>

      <button id="nicknameSave" class="nickname-save" type="button">확인</button>
    </div>
  </div>


  <div class="more-menu" id="moreMenu" aria-hidden="true">
    <button id="editNicknameBtn" type="button">
      <span class="more-menu-icon" aria-hidden="true">✎</span>
      <span>닉네임 수정</span>
    </button>
    <button id="openMediaBtn" type="button">
      <span class="more-menu-icon" aria-hidden="true">▦</span>
      <span>미디어 모아보기</span>
    </button>
  </div>

  <section class="media-gallery-modal" id="mediaGalleryModal" aria-hidden="true">
    <header class="media-gallery-header">
      <button class="media-gallery-back" id="mediaGalleryClose" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 4L7 12l8 8"/>
        </svg>
      </button>
      <div class="media-gallery-title-wrap">
        <div class="media-gallery-title">미디어 모아보기</div>
        <div class="media-gallery-count" id="mediaGalleryCount">0개</div>
      </div>
    </header>

    <div class="media-gallery-tabs" role="tablist" aria-label="미디어 종류">
      <button class="media-tab active" type="button" data-media-filter="all">전체</button>
      <button class="media-tab" type="button" data-media-filter="image">사진</button>
      <button class="media-tab" type="button" data-media-filter="video">영상</button>
    </div>

    <div class="media-gallery-grid" id="mediaGalleryGrid"></div>
    <div class="media-gallery-empty" id="mediaGalleryEmpty">아직 저장된 미디어가 없어</div>
  </section>

  <div class="phone" id="phone">
    <header class="header">
      <button class="back-btn" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 4L7 12l8 8"/>
        </svg>
      </button>

      <div class="header-center">
        <div class="room-title" id="roomTitle">건일 선배</div>
        <div class="room-status">
          <span class="heart" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 21s-7.2-4.7-9.7-8.8C.4 9.1 1.5 5.3 4.8 4.2c2.2-.7 4.5.2 5.7 2.1L12 8.5l1.5-2.2c1.2-1.9 3.5-2.8 5.7-2.1 3.3 1.1 4.4 4.9 2.5 8C19.2 16.3 12 21 12 21z"/>
            </svg>
          </span>
          <span id="roomStatus">980724</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="search-btn" id="searchBtn" aria-label="검색">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"/>
            <path d="M16 16l5 5"/>
          </svg>
        </button>
        <button class="more-btn" id="moreBtn" aria-label="더보기">⋮</button>
      </div>
    </header>

    <div class="search-box" id="searchBox">
      <div class="search-text-row">
        <input id="searchInput" type="search" placeholder="메시지 검색" />
        <button id="searchClose" type="button">취소</button>
      </div>

      <div class="date-search-row">
        <span class="date-search-label">날짜</span>
        <input id="dateSearchInput" type="date" />
        <button id="clearDateSearch" type="button">전체 보기</button>
      </div>
    </div>

    <main class="chat" id="chat"></main>

    <form class="composer" id="composer">
      <div class="input-pill">
        <textarea id="messageInput" rows="1" placeholder=""></textarea>
      </div>

      <button class="send-btn" id="sendBtn" type="submit" aria-label="보내기">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M3 4l22 10L3 24l3.8-8.1L17 14 6.8 12.1 3 4z"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="koobubble-data-v6.js"></script>
  <script src="koobubble-app-v13.js"></script>
</body>
</html>
